<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 Кетчуп-Пукалка 3000</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #2b0a0a 0%, #4a1010 50%, #2b0a0a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Летающие капли кетчупа на фоне */
        .bg-ketchup {
            position: absolute;
            font-size: 3rem;
            opacity: 0.05;
            pointer-events: none;
            animation: floatBg 20s infinite linear;
        }

        @keyframes floatBg {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.08; }
            90% { opacity: 0.08; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .container {
            background: rgba(30, 5, 5, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 2.5rem 2rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 50, 50, 0.15);
            border: 1px solid rgba(255, 80, 80, 0.1);
            position: relative;
            z-index: 2;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff3b3b, #ff8c42, #ff3b3b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
            letter-spacing: -0.02em;
            filter: drop-shadow(0 0 20px rgba(255, 60, 60, 0.2));
        }

        .subtitle {
            color: #cc6666;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1.8rem;
            opacity: 0.7;
        }

        /* Большая кнопка пука */
        .fart-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 35% 35%, #ff5555, #cc0000, #8b0000);
            color: #fff;
            font-size: 4rem;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 
                0 15px 40px rgba(200, 0, 0, 0.5),
                inset 0 -8px 20px rgba(0, 0, 0, 0.4),
                inset 0 8px 20px rgba(255, 150, 150, 0.2);
            margin: 0 auto 1.5rem;
            display: block;
            position: relative;
            animation: pulseBtn 2s infinite;
        }

        .fart-btn:hover {
            transform: scale(1.05);
            box-shadow: 
                0 20px 60px rgba(255, 30, 30, 0.6),
                inset 0 -8px 20px rgba(0, 0, 0, 0.4),
                inset 0 8px 20px rgba(255, 150, 150, 0.3);
        }

        .fart-btn:active {
            transform: scale(0.9);
            box-shadow: 
                0 5px 20px rgba(200, 0, 0, 0.4),
                inset 0 -4px 10px rgba(0, 0, 0, 0.6),
                inset 0 4px 10px rgba(255, 150, 150, 0.1);
        }

        .fart-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            animation: none;
        }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 15px 40px rgba(200, 0, 0, 0.5), inset 0 -8px 20px rgba(0, 0, 0, 0.4), inset 0 8px 20px rgba(255, 150, 150, 0.2); }
            50% { box-shadow: 0 15px 60px rgba(255, 30, 30, 0.7), inset 0 -8px 20px rgba(0, 0, 0, 0.4), inset 0 8px 20px rgba(255, 150, 150, 0.2); }
        }

        /* Выбор голоса */
        .voice-section {
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .voice-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 80, 80, 0.2);
            border-radius: 40px;
            color: #cc8888;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .voice-btn:hover {
            background: rgba(255, 80, 80, 0.1);
            border-color: rgba(255, 80, 80, 0.4);
            color: #ffaaaa;
        }

        .voice-btn.active {
            background: rgba(255, 50, 50, 0.2);
            border-color: #ff3b3b;
            color: #ffcccc;
            box-shadow: 0 0 20px rgba(255, 50, 50, 0.15);
        }

        /* Регуляторы */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding: 0 10px;
        }

        .slider-row label {
            color: #886666;
            font-size: 0.75rem;
            min-width: 70px;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .slider-row input[type="range"] {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #ff3b3b;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 50, 50, 0.4);
        }

        .slider-row input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #ff3b3b;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 15px rgba(255, 50, 50, 0.4);
        }

        /* Кнопка фразы */
        .phrase-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #ff3b3b, #cc0000);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            margin: 1rem auto;
            display: inline-block;
            box-shadow: 0 8px 30px rgba(255, 0, 0, 0.25);
            letter-spacing: 0.02em;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .phrase-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 40px rgba(255, 0, 0, 0.4);
        }

        .phrase-btn:active {
            transform: scale(0.95);
        }

        .phrase-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Статус */
        .status {
            color: #775555;
            font-size: 0.8rem;
            margin-top: 1rem;
            min-height: 1.5rem;
            transition: all 0.3s;
        }

        .status.active {
            color: #ff8888;
        }

        /* Эффект пука */
        .fart-effect {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 999;
            animation: fartAnim 1s ease-out forwards;
        }

        @keyframes fartAnim {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(2); }
        }

        @media (max-width: 480px) {
            .fart-btn { width: 140px; height: 140px; font-size: 3rem; }
            .title { font-size: 1.8rem; }
            .subtitle { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<!-- Фон с каплями кетчупа -->
<div class="bg-ketchup" style="left: 10%; animation-delay: 0s;">🍅</div>
<div class="bg-ketchup" style="left: 25%; animation-delay: 3s;">🍅</div>
<div class="bg-ketchup" style="left: 40%; animation-delay: 6s;">🍅</div>
<div class="bg-ketchup" style="left: 55%; animation-delay: 9s;">🍅</div>
<div class="bg-ketchup" style="left: 70%; animation-delay: 12s;">🍅</div>
<div class="bg-ketchup" style="left: 85%; animation-delay: 15s;">🍅</div>

<div class="container">
    <div class="title">🍅 Кетчуп-Пукалка 3000</div>
    <div class="subtitle">нажми и пукни кетчупом</div>

    <!-- Большая кнопка пука -->
    <button class="fart-btn" id="fartBtn">💨</button>

    <!-- Выбор голоса -->
    <div class="voice-section" id="voiceSection">
        <!-- Кнопки голосов добавляются через JS -->
    </div>

    <!-- Регуляторы -->
    <div class="slider-row">
        <label>Скорость</label>
        <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1">
    </div>
    <div class="slider-row">
        <label>Тон</label>
        <input type="range" id="pitchSlider" min="0.3" max="2.5" step="0.1" value="1">
    </div>

    <!-- Кнопка фразы -->
    <button class="phrase-btn" id="phraseBtn">🗣️ Скажи фразу</button>

    <!-- Статус -->
    <div class="status" id="status">Готов к пуканию</div>
</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        // 1. ФРАЗА
        // ============================================================

        const PHRASE = 'Твоя мама пукает кетчупом, а бабушка майонезом';

        // ============================================================
        // 2. ЭЛЕМЕНТЫ
        // ============================================================

        const fartBtn = document.getElementById('fartBtn');
        const phraseBtn = document.getElementById('phraseBtn');
        const voiceSection = document.getElementById('voiceSection');
        const rateSlider = document.getElementById('rateSlider');
        const pitchSlider = document.getElementById('pitchSlider');
        const status = document.getElementById('status');

        // ============================================================
        // 3. ГОЛОСА
        // ============================================================

        let voices = [];
        let selectedVoice = null;

        function loadVoices() {
            voices = speechSynthesis.getVoices();

            // Фильтруем только русские голоса (если есть)
            let ruVoices = voices.filter(v => v.lang.startsWith('ru'));

            // Если русских нет — берём все
            if (ruVoices.length === 0) {
                ruVoices = voices;
            }

            // Ограничиваем 6 голосами
            ruVoices = ruVoices.slice(0, 6);

            // Очищаем секцию
            voiceSection.innerHTML = '';

            if (ruVoices.length === 0) {
                voiceSection.innerHTML = '<span style="color:#886666;font-size:0.8rem;">Голоса загружаются...</span>';
                return;
            }

            // Создаём кнопки
            ruVoices.forEach((voice, index) => {
                const btn = document.createElement('button');
                btn.className = 'voice-btn' + (index === 0 ? ' active' : '');
                btn.textContent = voice.name.length > 18 ? voice.name.substring(0, 16) + '…' : voice.name;
                btn.title = voice.name + ' (' + voice.lang + ')';
                btn.dataset.index = index;

                btn.addEventListener('click', () => {
                    document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedVoice = voice;
                    status.textContent = 'Голос: ' + voice.name;
                    status.classList.add('active');
                });

                voiceSection.appendChild(btn);
            });

            // Выбираем первый голос
            selectedVoice = ruVoices[0];
            status.textContent = 'Голос: ' + selectedVoice.name;
            status.classList.add('active');
        }

        // Загружаем голоса (с задержкой для некоторых браузеров)
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();

        // Повторная попытка через 500 мс
        setTimeout(loadVoices, 500);
        setTimeout(loadVoices, 1500);

        // ============================================================
        // 4. СИНТЕЗ РЕЧИ
        // ============================================================

        let isSpeaking = false;

        function speak(text, rate, pitch) {
            if (isSpeaking) {
                speechSynthesis.cancel();
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = rate || 1;
            utterance.pitch = pitch || 1;
            utterance.volume = 1;

            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.onstart = () => {
                isSpeaking = true;
                phraseBtn.disabled = true;
                fartBtn.disabled = true;
                status.textContent = '🔊 Говорю...';
                status.classList.add('active');
            };

            utterance.onend = () => {
                isSpeaking = false;
                phraseBtn.disabled = false;
                fartBtn.disabled = false;
                status.textContent = '✅ Готово!';
                status.classList.add('active');
            };

            utterance.onerror = (e) => {
                isSpeaking = false;
                phraseBtn.disabled = false;
                fartBtn.disabled = false;
                status.textContent = '⚠️ Ошибка синтеза';
                console.error('Speech error:', e);
            };

            speechSynthesis.speak(utterance);
        }

        // ============================================================
        // 5. ЗВУК ПУКА (Web Audio)
        // ============================================================

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('Audio не поддерживается');
                }
            }
        }

        function playFartSound() {
            initAudio();
            if (!audioCtx) return;

            // Создаём низкий "пукающий" звук
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(80, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            oscillator.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.5);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);

            // Добавляем шум для "влажности"
            const bufferSize = audioCtx.sampleRate * 0.3;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * 0.15 * Math.exp(-i / (bufferSize * 0.3));
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();
        }

        // ============================================================
        // 6. ЭФФЕКТ КЕТЧУПА
        // ============================================================

        function spawnKetchupEffect() {
            const effect = document.createElement('div');
            effect.className = 'fart-effect';
            effect.textContent = ['🍅', '💨', '🍅', '💦', '🥫'][Math.floor(Math.random() * 5)];

            const rect = fartBtn.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            effect.style.left = x + 'px';
            effect.style.top = y + 'px';

            const dx = (Math.random() - 0.5) * 300;
            const dy = (Math.random() - 0.5) * 300;

            effect.style.setProperty('--dx', dx + 'px');
            effect.style.setProperty('--dy', dy + 'px');

            document.body.appendChild(effect);

            setTimeout(() => effect.remove(), 1000);
        }

        // ============================================================
        // 7. ОБРАБОТЧИКИ
        // ============================================================

        // Кнопка пука
        fartBtn.addEventListener('click', () => {
            playFartSound();

            // Спавним 3 эффекта кетчупа
            for (let i = 0; i < 3; i++) {
                setTimeout(() => spawnKetchupEffect(), i * 100);
            }

            status.textContent = '💨 Пук! Кетчуп разлетелся!';
            status.classList.add('active');
        });

        // Кнопка фразы
        phraseBtn.addEventListener('click', () => {
            const rate = parseFloat(rateSlider.value);
            const pitch = parseFloat(pitchSlider.value);
            speak(PHRASE, rate, pitch);
        });

        // Горячая клавиша: пробел = пук
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                fartBtn.click();
            }
            if (e.code === 'Enter') {
                e.preventDefault();
                phraseBtn.click();
            }
        });

        // ============================================================
        // 8. СТАРТ
        // ============================================================

        console.log('🍅 Кетчуп-Пукалка 3000 запущена!');
        console.log('📢 Фраза:', PHRASE);
        console.log('💡 Пробел = пук, Enter = фраза');

    })();
</script>

</body>
</html>
